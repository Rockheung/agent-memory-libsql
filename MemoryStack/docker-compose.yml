# Memory Stack — cliproxy 앞단에 기억을 끼우는 3층 세트
#
#   BrowserOS / LibreChat / 임의 OpenAI 호환 클라이언트
#         │  (헤더 못 보냄)
#         ▼
#   edge (nginx)     :${EDGE_PORT}   ← team/agent/task 헤더 주입
#         ▼
#   memory-proxy     :8096           ← 세션·주입·기록
#         ▼
#   cliproxy         (외부)          ← 모델 라우팅·effort·web_search
#         ▼
#   memory-core      :8420           ← L0~L3 저장·추출  (proxy 가 옆으로 호출)
#
# edge 만 외부에 노출한다. core/proxy 는 내부 네트워크 전용.

name: memory-stack

services:
  # core config 도 .env 값(LLM 키 등)이 필요하다. proxy-config 와 같은 방식으로 렌더링한다.
  core-config:
    image: nginx:1.27-alpine
    container_name: ms-core-config
    environment:
      PROXY_UPSTREAM_URL: ${PROXY_UPSTREAM_URL:?}
      PROXY_UPSTREAM_API_KEY: ${PROXY_UPSTREAM_API_KEY:?}
      EMBED_BASE_URL: ${EMBED_BASE_URL:-http://127.0.0.1:11434/v1}
    volumes:
      - ./core:/src:ro
      - core-conf:/out
    command:
      - sh
      - -c
      - >-
        envsubst '$$PROXY_UPSTREAM_URL $$PROXY_UPSTREAM_API_KEY $$EMBED_BASE_URL'
        < /src/tdai-gateway.yaml.template > /out/tdai-gateway.yaml
        && test -s /out/tdai-gateway.yaml
        && echo "rendered $$(wc -c < /out/tdai-gateway.yaml) bytes"

  core:
    # 포크 코드가 필요하다. upstream 이미지를 베이스로 바뀐 소스 + 관리형 백엔드
    # 의존성만 얹는다 (core/Dockerfile 주석 참조).
    # 이미지는 CI 가 빌드해 ghcr 에 올린다 (.github/workflows/build-images.yml).
    # 여기서 빌드하지 않는다 — 그래야 "지금 도는 게 어느 커밋인가" 에 답할 수 있다.
    # 특정 커밋으로 고정하려면 .env 의 IMAGE_TAG 에 커밋 SHA 를 넣는다.
    image: ghcr.io/rockheung/memory-core-libsql:${IMAGE_TAG:-latest}
    container_name: ms-core
    restart: unless-stopped
    depends_on:
      core-config: {condition: service_completed_successfully}
      sqld: {condition: service_healthy}
    # core 도 L1/L2/L3 추출을 위해 cliproxy(10.77.0.4, wg0 전용 바인딩)를 직접 부른다.
    # 브리지에 두면 EHOSTUNREACH 로 추출이 조용히 0건이 된다 — 응답은 정상이라
    # 로그를 안 보면 놓친다. proxy/edge 와 같은 이유로 host 네트워크를 쓴다.
    network_mode: host
    environment:
      TDAI_GATEWAY_PORT: "8420"
      # host 네트워크. 0.0.0.0 에 바인딩하되 방화벽으로 홈랩 LAN + 오버레이망만
      # 허용한다 (cliproxy 8317 과 동일 정책). ClaudeCodeAdapter 같은 외부 클라이언트가
      # /v3/* 를 직접 호출해야 하므로 루프백만으로는 부족하다.
      # 데이터 평면은 TDAI_GATEWAY_API_KEY 로 보호된다.
      TDAI_GATEWAY_HOST: "${CORE_BIND:-0.0.0.0}"
      # 비우면 데이터 평면이 "비어있지 않은 아무 Bearer" 나 통과시킨다.
      # 내부망 전용이라도 반드시 채울 것. (docs/06-M0-RESULT.md F3)
      TDAI_GATEWAY_API_KEY: "${GATEWAY_API_KEY:?GATEWAY_API_KEY 를 .env 에 설정하세요}"
      TDAI_DATA_DIR: /data/tdai-memory

      # ── 메타데이터 → Turso ──
      TDAI_METADATA_LIBSQL_URL: "${TURSO_URL:?TURSO_URL 을 .env 에 설정하세요}"
      TDAI_METADATA_LIBSQL_AUTH_TOKEN: "${TURSO_AUTH_TOKEN:-}"
      # ── L0/L1 + 벡터 + Skill → Turso ──
      TDAI_STORE_LIBSQL_URL: "${TURSO_URL:?}"
      TDAI_STORE_LIBSQL_AUTH_TOKEN: "${TURSO_AUTH_TOKEN:-}"
      # ── L2/L3 마크다운 · JSONL · checkpoint · 생성이력 → S3 호환 ──
      TDAI_STORAGE_S3_ENDPOINT: "${S3_ENDPOINT:?}"
      TDAI_STORAGE_S3_REGION: "${S3_REGION:-ap-seoul-1}"
      TDAI_STORAGE_S3_BUCKET: "${S3_BUCKET:?}"
      TDAI_STORAGE_S3_ACCESS_KEY_ID: "${S3_ACCESS_KEY_ID:?}"
      TDAI_STORAGE_S3_SECRET_ACCESS_KEY: "${S3_SECRET_ACCESS_KEY:?}"
      TDAI_STORAGE_S3_PREFIX: "${S3_PREFIX:-prod/}"
    volumes:
      # core-data 볼륨이 없다. 상태가 전부 Turso + Object Storage 에 있어
      # 컨테이너는 무상태다. 로컬에 남는 건 .metadata/manifest.json 뿐이고
      # 그건 재기동 시 다시 만들어지는 진단용 표식이다 (docs/11 부록 참조).
      - core-conf:/data/config:ro
    # 외부 비노출. 디버깅 때만 아래 주석 해제.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:8420/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # MemoryProxy 의 config 로더는 ${VAR} 치환을 systemUsers 블록에만 적용한다
  # (src/config.ts:481-484). 나머지는 literal 로 들어가므로 여기서 미리 렌더링한다.
  proxy-config:
    image: nginx:1.27-alpine        # envsubst 가 들어있어 그대로 재사용
    container_name: ms-proxy-config
    environment:
      PROXY_UPSTREAM_URL: ${PROXY_UPSTREAM_URL:?}
      PROXY_UPSTREAM_API_KEY: ${PROXY_UPSTREAM_API_KEY:?}
      GATEWAY_API_KEY: "${GATEWAY_API_KEY:?}"
    volumes:
      - ./proxy:/src:ro
      - proxy-conf:/out
    command:
      # envsubst 의 SHELL-FORMAT 인자는 "치환할 변수 이름 목록" 이다. 값을 넘기면
      # 빈 목록이 되어 결과가 0 바이트가 된다. 목록을 문자열로 정확히 준다.
      - sh
      - -c
      - >-
        envsubst '$$PROXY_UPSTREAM_URL $$PROXY_UPSTREAM_API_KEY $$GATEWAY_API_KEY'
        < /src/config.yaml.template > /out/config.yaml
        && test -s /out/config.yaml
        && echo "rendered $$(wc -c < /out/config.yaml) bytes"
    networks: [ms]

  proxy:
    # 포크 빌드가 필요하다 — auth Bearer 수정 (proxy/Dockerfile 주석 참조)
    image: ghcr.io/rockheung/memory-proxy-auth:${IMAGE_TAG:-latest}
    container_name: ms-proxy
    network_mode: host          # 상위 LLM(cliproxy)이 wg0 전용 바인딩이라 필요하다
    restart: unless-stopped
    depends_on:
      core: {condition: service_healthy}
      proxy-config: {condition: service_completed_successfully}
    volumes:
      - proxy-conf:/app/conf:ro
      - proxy-data:/app/data
    # 번들 이미지라 tsx 가 필요 없다. Dockerfile 의 CMD 와 동일하지만 명시해둔다.
    command: ["node", "/app/proxy.js", "--config", "/app/conf/config.yaml"]
    healthcheck:
      # 프록시는 인증이 걸린 라우트뿐이라 응답 코드가 아니라 "응답을 하는지" 로 본다
      test: ["CMD-SHELL", "curl -sS -o /dev/null --max-time 3 http://127.0.0.1:8096/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  edge:
    image: nginx:1.27-alpine      # 순정. njs 불필요 (호스트네임이 스위치)
    container_name: ms-edge
    # cliproxy 가 WireGuard 인터페이스(10.77.0.4)에만 바인딩돼 있어 도커 브리지에서
    # 닿지 않는다. 엣지만 호스트 네트워크에 붙여 오버레이망으로 나갈 수 있게 한다.
    # (proxy 도 cliproxy 를 부르므로 아래에서 같은 처리를 한다.)
    network_mode: host
    restart: unless-stopped
    depends_on: [proxy]
    environment:
      TEAM_ID: "${TEAM_ID:-}"
      AGENT_ID: "${AGENT_ID:-}"
      TASK_ID: ${TASK_ID:-}
      AGENT_SOURCE: ${AGENT_SOURCE:-codebuddy}
      SPACE_ID: ${SPACE_ID:-default}
      # /v1 을 붙이지 않은 베이스. 엣지가 $request_uri 를 그대로 이어붙인다.
      UPSTREAM_BASE: "${UPSTREAM_BASE:?UPSTREAM_BASE 를 .env 에 설정하세요}"
      # /v1/models 를 cliproxy 로 직통시킬 때 쓰는 키. 위 location 블록 주석 참조.
      PROXY_UPSTREAM_API_KEY: "${PROXY_UPSTREAM_API_KEY:?}"
      EDGE_PORT: "${EDGE_PORT:-8090}"
    volumes:
      - ./edge/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    # compose 는 up 대상이 아닌 서비스의 변수까지 보간한다. bootstrap.sh 가 ID 를
    # 채우기 전에 core 만 띄울 수 있어야 하므로, 필수 검사를 여기서 한다.
    entrypoint: ["sh","-c","test -n \"$$TEAM_ID\" -a -n \"$$AGENT_ID\" || { echo 'TEAM_ID/AGENT_ID 가 비어있다 — ./bootstrap.sh 를 먼저 실행하세요'; exit 1; }; exec /docker-entrypoint.sh nginx -g 'daemon off;'"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${EDGE_PORT:-8090}/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  # 스냅샷 배치. 상시 기동하지 않는다 — profiles 로 빼두고 타이머가 run --rm 으로 부른다.
  #   docker compose --profile backup run --rm backup
  # core 이미지를 그대로 쓴다 (@libsql/client / @aws-sdk/client-s3 가 이미 들어있다).
  backup:
    image: ghcr.io/rockheung/memory-core-libsql:${IMAGE_TAG:-latest}
    profiles: ["backup"]
    container_name: ms-backup
    # Turso/S3 는 공인망이다. host 로 두면 wg0 바인딩 문제를 안 겪는다.
    network_mode: host
    environment:
      # 자체 호스팅 sqld 는 인증 없이 127.0.0.1 바인딩으로 쓴다.
      # 관리형 Turso 로 되돌리려면 .env 에 URL 과 토큰을 채우면 된다.
      TURSO_URL: ${TURSO_URL:?}
      TURSO_AUTH_TOKEN: ${TURSO_AUTH_TOKEN:-}
      S3_ENDPOINT: ${S3_ENDPOINT:?}
      S3_REGION: ${S3_REGION:-us-ashburn-1}
      S3_BUCKET: ${S3_BUCKET:?}
      S3_PREFIX: ${S3_PREFIX:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
    working_dir: /app
    volumes:
      # /app 하위여야 한다. ESM 은 임포트한 파일 위치에서 node_modules 를 찾지
      # cwd 를 보지 않는다 — /opt 에 두면 @libsql/client 를 못 찾는다.
      - ./backup:/app/backup:ro
      - ${BACKUP_DIR:-/var/backups/memory-stack}:/backup
    entrypoint: ["node", "/app/backup/snapshot.mjs"]

  # 자체 호스팅 libSQL 서버. Turso 관리형 대신 쓴다.
  #
  # 왜 옮겼나: Turso 무료 플랜의 **읽기 쿼터**가 소진돼 SELECT 1 까지 막혔다
  # (2026-08-28). 원인은 백업이 임베디드 리플리카로 DB 파일 전량(472MB)을
  # 매일 읽은 것 — 그중 96%가 고아 인덱스가 남긴 빈 페이지였다.
  # 자체 호스팅에는 쿼터가 없다. 프로토콜이 같아 이식 코드는 한 줄도 안 고친다.
  #
  # 127.0.0.1 에만 바인딩한다. core 가 host 네트워크라 그대로 닿는다.
  sqld:
    image: ghcr.io/tursodatabase/libsql-server:latest
    container_name: ms-sqld
    restart: unless-stopped
    network_mode: host
    environment:
      SQLD_NODE: primary
      SQLD_HTTP_LISTEN_ADDR: 127.0.0.1:8081
    volumes:
      - sqld-data:/var/lib/sqld
    healthcheck:
      # 이미지에 curl/wget 이 없다. bash 의 /dev/tcp 로 HTTP 를 직접 친다.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200'"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

networks:
  ms:
    driver: bridge

volumes:
  sqld-data:
  core-conf:       # 렌더링된 core config
  # core 데이터 볼륨 없음 — 무상태
  proxy-data:      # 세션 초기화 상태 (sqlite). 유실되면 세션 폼을 다시 탄다
  proxy-conf:      # 렌더링된 proxy config
